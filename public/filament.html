<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Filament — Filament Manager</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Filaments">
  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1a202c;
      --text-muted: #718096;
      --primary: #0f766e;
      --primary-h: #0d6059;
      --danger: #e53e3e;
      --radius: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.06);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f172a; --surface: #1e293b; --border: #334155;
        --text: #f1f5f9; --text-muted: #94a3b8;
        --primary: #14b8a6; --primary-h: #0d9488;
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button {
      -webkit-appearance: none; appearance: none;
      font: inherit; color: inherit; background: transparent;
      border: none; padding: 0; margin: 0; cursor: pointer;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px; color: var(--text); background: var(--bg);
      min-height: 100vh; min-height: 100dvh;
    }
    @supports (padding-top: env(safe-area-inset-top)) {
      body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
      .topbar { background-clip: padding-box; }
    }
    .topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 0 16px; height: 52px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow); position: sticky; top: 0; z-index: 10;
    }
    .topbar a, .topbar .back-btn { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 15px; padding: 6px 8px; }
    .back-btn { display: inline-flex; align-items: center; gap: 4px; }
    .topbar h1 {
      font-size: 16px; font-weight: 700; color: var(--text);
      flex: 1; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    main { max-width: 880px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
    .swatch-hero {
      width: 100%; aspect-ratio: 16/9; max-height: 280px;
      border-radius: var(--radius); border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 4px 12px rgba(0,0,0,.18);
      background-size: cover; background-position: center;
      position: relative;
    }
    .swatch-hero .stock-badge {
      position: absolute; top: 12px; right: 12px;
      padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
      background: rgba(255,255,255,.92); color: #1a202c;
      border: 1px solid rgba(0,0,0,.12);
    }
    .swatch-hero .stock-badge.out {
      background: rgba(0,0,0,.42); color: #fff; border-color: rgba(255,255,255,.25);
    }
    .heading { display: flex; flex-direction: column; gap: 4px; }
    .heading .brand { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
    .heading .name  { font-size: 22px; font-weight: 700; color: var(--text); }
    .heading .meta  { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

    .info-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 12px; }
    .info-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg);
      font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px;
    }
    .info-row .label { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; min-width: 38px; }
    .info-row .value { flex: 1; user-select: all; word-break: break-all; }
    .info-row .copy-btn {
      padding: 6px 10px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border);
      font-size: 12px; color: var(--text-muted); font-family: -apple-system, sans-serif;
    }
    .info-row .copy-btn:hover { background: var(--border); }
    .info-row.copied .copy-btn { background: var(--primary); color: #fff; border-color: var(--primary); }

    .gallery-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .gallery-header h2 { font-size: 14px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: .5px; }
    .upload-btn {
      padding: 6px 14px; border-radius: 6px; background: var(--primary); color: #fff;
      font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
    }
    .upload-btn:hover { background: var(--primary-h); }
    .upload-btn:disabled { opacity: .6; cursor: default; }
    .gallery {
      display: grid; gap: 8px;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    }
    .gallery .item {
      position: relative; aspect-ratio: 1; border-radius: var(--radius); overflow: hidden;
      background: var(--bg); border: 1px solid var(--border); cursor: zoom-in;
    }
    .gallery .item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gallery .item .delete {
      position: absolute; top: 6px; right: 6px; width: 26px; height: 26px;
      background: rgba(0,0,0,.55); color: #fff; border-radius: 50%; font-size: 14px;
      display: none; align-items: center; justify-content: center;
    }
    .gallery .item:hover .delete { display: flex; }
    .gallery.editable .item .delete { display: flex; }
    .gallery-empty { padding: 24px; text-align: center; color: var(--text-muted); border: 2px dashed var(--border); border-radius: var(--radius); font-size: 13px; }

    /* Upload progress bar */
    .upload-progress {
      margin-top: 12px; padding: 10px 12px;
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
      display: none; flex-direction: column; gap: 6px;
    }
    .upload-progress.active { display: flex; }
    .upload-progress .label { font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; }
    .upload-progress .bar { height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .upload-progress .bar-fill {
      height: 100%; width: 0%; background: var(--primary);
      transition: width .15s linear;
    }
    .upload-progress.indeterminate .bar-fill {
      width: 30% !important;
      animation: indeterminate 1.2s ease-in-out infinite;
    }
    @keyframes indeterminate {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(380%); }
    }

    /* Drag-and-drop */
    .drop-zone { position: relative; }
    .drop-zone.dragover {
      outline: 3px dashed var(--primary);
      outline-offset: -3px;
      background: rgba(15, 118, 110, 0.06);
    }
    .drop-overlay {
      position: absolute; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(15, 118, 110, 0.85); color: #fff;
      font-size: 18px; font-weight: 700; pointer-events: none;
      border-radius: var(--radius); z-index: 5;
    }
    .drop-zone.dragover .drop-overlay { display: flex; }

    /* Lightbox / image slider */
    .lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,.92);
      display: none; flex-direction: column;
      z-index: 100; user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .lightbox.open { display: flex; }
    .lightbox-bar {
      flex-shrink: 0; height: 48px; padding: 0 16px;
      display: flex; align-items: center; justify-content: space-between;
      color: #fff; font-size: 14px; font-weight: 600;
    }
    .lightbox-bar button {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.15); color: #fff; font-size: 22px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .lightbox-bar button:hover { background: rgba(255,255,255,.25); }
    .lightbox-counter { font-variant-numeric: tabular-nums; font-size: 13px; opacity: .8; }
    .lightbox-stage {
      flex: 1; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      touch-action: pan-y;
    }
    .lightbox-track {
      display: flex; align-items: center;
      width: 100%; height: 100%;
      transition: transform .25s ease;
      will-change: transform;
    }
    .lightbox-track.dragging { transition: none; }
    .lightbox-slide {
      flex: 0 0 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 0 16px;
    }
    .lightbox-slide img {
      max-width: 100%; max-height: 100%; object-fit: contain;
      pointer-events: none; /* let the stage receive touches */
    }
    .lightbox-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(255,255,255,.15); color: #fff; font-size: 28px;
      display: flex; align-items: center; justify-content: center;
      z-index: 2;
    }
    .lightbox-arrow:hover { background: rgba(255,255,255,.28); }
    .lightbox-arrow.prev { left: 12px; }
    .lightbox-arrow.next { right: 12px; }
    .lightbox-arrow.disabled { opacity: .25; pointer-events: none; }
    @media (max-width: 480px) {
      .lightbox-arrow { display: none; }   /* mobile uses swipe */
    }

    /* Mobile */
    @media (max-width: 480px) {
      main { padding: 12px; gap: 12px; }
      .card { padding: 14px; }
      .swatch-hero { aspect-ratio: 4/3; max-height: 220px; }
      .heading .name { font-size: 19px; }
      .gallery { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <button id="back-btn" class="back-btn" type="button">‹ Back</button>
    <h1 id="title">Filament</h1>
  </header>
  <main id="main">
    <div class="card" id="loading" style="text-align:center;color:var(--text-muted)">Loading…</div>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-bar">
      <span class="lightbox-counter" id="lightbox-counter"></span>
      <button id="lightbox-close" type="button" aria-label="Close">✕</button>
    </div>
    <div class="lightbox-stage" id="lightbox-stage">
      <button class="lightbox-arrow prev" id="lightbox-prev" type="button" aria-label="Previous">‹</button>
      <div class="lightbox-track" id="lightbox-track"></div>
      <button class="lightbox-arrow next" id="lightbox-next" type="button" aria-label="Next">›</button>
    </div>
  </div>

  <script>
    const $ = sel => document.querySelector(sel);
    const $$ = sel => Array.from(document.querySelectorAll(sel));
    const escHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

    // Filament id from /filament/<id>
    const idMatch = location.pathname.match(/^\/filament\/(\d+)$/);
    const filamentId = idMatch ? Number(idMatch[1]) : null;
    if (!filamentId) { document.body.innerHTML = '<p style="padding:32px;text-align:center">Invalid filament id.</p>'; throw new Error('no id'); }

    let isLoggedIn = false;
    let heicLib = null;

    async function detectAuth() {
      try {
        const r = await fetch('/api/whoami', { credentials: 'include' });
        if (!r.ok) { isLoggedIn = false; return; }
        const j = await r.json();
        isLoggedIn = !!j.loggedIn;
      } catch { isLoggedIn = false; }
    }

    async function loadFilament() {
      if (isLoggedIn) {
        // Pull the row from the list since there's no /api/filaments/:id (yet).
        const r = await fetch('/api/filaments', { credentials: 'include' });
        if (!r.ok) throw new Error('Filament not found or unavailable');
        const list = await r.json();
        const f = list.find(x => x.id === filamentId);
        if (!f) throw new Error('Filament not found');
        const r2 = await fetch(`/api/filaments/${filamentId}/images`, { credentials: 'include' });
        f.images = r2.ok ? await r2.json() : [];
        return f;
      }
      const r = await fetch(`/api/public/filament/${filamentId}`, { credentials: 'include' });
      if (!r.ok) throw new Error('Filament not found or unavailable');
      const f = await r.json();
      f.images = f.images || [];
      return f;
    }

    function rgbCss(rgb) {
      if (!rgb) return '';
      return `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
    }

    function copy(text, row) {
      navigator.clipboard?.writeText(text).then(() => {
        row.classList.add('copied');
        const btn = row.querySelector('.copy-btn');
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { row.classList.remove('copied'); btn.textContent = orig; }, 1200);
      }).catch(() => {});
    }

    function render(f) {
      document.title = `${f.brand} ${f.colorName} — Filament Manager`;
      $('#title').textContent = `${f.brand} — ${f.colorName}`;

      const main = $('#main');
      const hexUpper = (f.colorHex || '').toUpperCase();
      const rgbStr = f.colorRGB ? `rgb(${f.colorRGB.r}, ${f.colorRGB.g}, ${f.colorRGB.b})` : '';

      const swatchStyle = f.patternImage
        ? `background-color:${f.colorHex};background-image:url(/uploads/${encodeURIComponent(f.patternImage)})`
        : `background-color:${f.colorHex}`;

      // Hero + heading + info
      let html = `
        <div class="card">
          <div class="swatch-hero" style="${swatchStyle}">
            <span class="stock-badge ${f.inStock ? '' : 'out'}">${f.inStock ? 'In stock' : 'Out of stock'}</span>
          </div>
          <div class="heading" style="margin-top:14px">
            <span class="brand">${escHtml(f.brand)}</span>
            <span class="name">${escHtml(f.colorName)}</span>
            <span class="meta">${escHtml(f.type)} (${escHtml(f.variant || 'Basic')})</span>
          </div>
          <div class="info-grid">
            <div class="info-row" data-copy="${escHtml(hexUpper)}">
              <span class="label">HEX</span>
              <span class="value">${escHtml(hexUpper)}</span>
              ${isLoggedIn ? '<button class="copy-btn">Copy</button>' : ''}
            </div>
            <div class="info-row" data-copy="${escHtml(rgbStr)}">
              <span class="label">RGB</span>
              <span class="value">${escHtml(rgbStr)}</span>
              ${isLoggedIn ? '<button class="copy-btn">Copy</button>' : ''}
            </div>
          </div>
        </div>
      `;

      // Gallery
      html += `
        <div class="card ${isLoggedIn ? 'drop-zone' : ''}" id="gallery-card">
          ${isLoggedIn ? '<div class="drop-overlay">Drop to upload</div>' : ''}
          <div class="gallery-header">
            <h2 id="gallery">Gallery</h2>
            ${isLoggedIn ? '<button id="upload-btn" class="upload-btn">＋ Add images</button>' : ''}
          </div>
          ${f.images.length
            ? `<div class="gallery${isLoggedIn ? ' editable' : ''}" id="gallery-grid">
                ${f.images.map(img => `
                  <div class="item" data-id="${img.id}" data-url="${escHtml(img.url)}">
                    <img src="${escHtml(img.url)}" alt="${escHtml(img.caption || '')}" loading="lazy">
                    ${isLoggedIn ? '<button class="delete" title="Delete">✕</button>' : ''}
                  </div>
                `).join('')}
              </div>`
            : `<div class="gallery-empty">No images yet${isLoggedIn ? ' — tap "＋ Add images" or drop files here to upload' : ''}.</div>`}
          ${isLoggedIn ? '<input type="file" id="file-input" accept="image/*,.heic,.heif" multiple style="display:none">' : ''}
          ${isLoggedIn ? `
            <div class="upload-progress" id="upload-progress">
              <div class="label"><span id="upload-label">Preparing…</span><span id="upload-percent"></span></div>
              <div class="bar"><div class="bar-fill" id="upload-fill"></div></div>
            </div>
          ` : ''}
        </div>
      `;

      main.innerHTML = html;

      // Wire copy buttons (logged-in only)
      $$('.info-row .copy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const row = btn.closest('.info-row');
          copy(row.dataset.copy, row);
        });
      });

      // Wire gallery
      const galleryUrls = (f.images || []).map(img => img.url);
      $$('.gallery .item').forEach((item, idx) => {
        item.addEventListener('click', e => {
          if (e.target.classList.contains('delete')) return;
          openLightbox(galleryUrls, idx);
        });
        const del = item.querySelector('.delete');
        if (del) del.addEventListener('click', async e => {
          e.stopPropagation();
          if (!confirm('Delete this image?')) return;
          await fetch(`/api/filaments/${filamentId}/images/${item.dataset.id}`, { method: 'DELETE', credentials: 'include' });
          init();
        });
      });

      // Wire upload (logged-in only)
      const uploadBtn = $('#upload-btn');
      const fileInput = $('#file-input');
      const dropZone = $('#gallery-card');
      if (uploadBtn && fileInput) {
        uploadBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => uploadFiles(fileInput.files));
      }
      // Drag-and-drop on the gallery card (re-attached on each render)
      if (isLoggedIn && dropZone) {
        ['dragenter', 'dragover'].forEach(ev => dropZone.addEventListener(ev, e => {
          e.preventDefault(); e.stopPropagation();
          dropZone.classList.add('dragover');
        }));
        ['dragleave', 'dragend'].forEach(ev => dropZone.addEventListener(ev, e => {
          if (e.currentTarget === dropZone && (!e.relatedTarget || !dropZone.contains(e.relatedTarget))) {
            dropZone.classList.remove('dragover');
          }
        }));
        dropZone.addEventListener('drop', e => {
          e.preventDefault(); e.stopPropagation();
          dropZone.classList.remove('dragover');
          const files = Array.from(e.dataTransfer?.files || []).filter(f => f.type.startsWith('image/') || /\.(heic|heif)$/i.test(f.name));
          if (files.length) uploadFiles(files);
        });
      }
    }

    // ---- One-time global wiring (paste + window-level drag swallow) ----
    document.addEventListener('paste', e => {
      if (!isLoggedIn) return;
      const items = Array.from(e.clipboardData?.items || []);
      const files = items
        .filter(it => it.kind === 'file' && it.type.startsWith('image/'))
        .map(it => it.getAsFile())
        .filter(Boolean);
      if (files.length) uploadFiles(files);
    });
    // Prevent the browser from navigating to the dropped file when the user
    // misses the drop zone. The drop zone has its own handler that runs first.
    ['dragover', 'drop'].forEach(ev => window.addEventListener(ev, e => {
      if (e.target.closest('#gallery-card')) return;
      e.preventDefault();
    }));

    async function ensureHeicLib() {
      if (heicLib) return heicLib;
      // Lazy-load heic2any only when needed
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = '/heic2any.min.js';
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
      heicLib = window.heic2any;
      return heicLib;
    }

    async function fileToJpeg(file) {
      // Decide whether the file actually needs HEIC→JPEG conversion. iOS Safari
      // can hand us files whose extension is .heic but whose MIME type is
      // already image/jpeg (the "Most Compatible" capture mode auto-converts
      // on share). Trust the type first; only treat the filename as a hint
      // when the browser didn't sniff a usable image type at all.
      const typeIsHeic  = /image\/(heic|heif)/i.test(file.type);
      const typeIsImage = /^image\//.test(file.type);
      const nameIsHeic  = /\.(heic|heif)$/i.test(file.name);
      const shouldConvert = typeIsHeic || (!typeIsImage && nameIsHeic);
      if (!shouldConvert) return file;
      try {
        const lib = await ensureHeicLib();
        const blob = await lib({ blob: file, toType: 'image/jpeg', quality: 0.9 });
        return new File([blob], file.name.replace(/\.(heic|heif)$/i, '.jpg'), { type: 'image/jpeg' });
      } catch (e) {
        // heic2any throws ERR_USER ("Image is already browser readable") when
        // the input is actually a JPEG/PNG with a .heic extension. Just upload
        // it as-is in that case.
        if (e && /already.*browser.*readable/i.test(e.message || '')) return file;
        throw e;
      }
    }

    function showProgress(label, indeterminate = false, percent = 0) {
      const wrap = $('#upload-progress');
      const lbl  = $('#upload-label');
      const pct  = $('#upload-percent');
      const fill = $('#upload-fill');
      if (!wrap) return;
      wrap.classList.add('active');
      wrap.classList.toggle('indeterminate', !!indeterminate);
      lbl.textContent = label;
      pct.textContent = indeterminate ? '' : Math.round(percent) + '%';
      if (!indeterminate) fill.style.width = Math.min(100, Math.max(0, percent)) + '%';
    }
    function hideProgress() {
      const wrap = $('#upload-progress');
      if (!wrap) return;
      wrap.classList.remove('active', 'indeterminate');
      $('#upload-fill').style.width = '0%';
    }

    function postWithProgress(url, formData, onProgress) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', url);
        xhr.withCredentials = true;
        xhr.upload.addEventListener('progress', e => {
          if (e.lengthComputable && onProgress) onProgress(e.loaded, e.total);
        });
        xhr.addEventListener('load', () => {
          if (xhr.status >= 200 && xhr.status < 300) resolve(xhr.responseText);
          else reject(new Error(`HTTP ${xhr.status}: ${xhr.responseText || xhr.statusText}`));
        });
        xhr.addEventListener('error', () => reject(new Error('Network error')));
        xhr.addEventListener('abort', () => reject(new Error('Upload aborted')));
        xhr.send(formData);
      });
    }

    async function uploadFiles(fileList) {
      if (!fileList?.length) return;
      const btn = $('#upload-btn');
      const total = fileList.length;
      btn.disabled = true;
      btn.textContent = 'Uploading…';
      try {
        // Phase 1: convert any HEIC files. heic2any can be slow on large
        // photos so we show indeterminate progress while it runs.
        const converted = [];
        for (let i = 0; i < total; i++) {
          showProgress(`Preparing ${i + 1} of ${total}…`, true);
          converted.push(await fileToJpeg(fileList[i]));
        }
        // Phase 2: actual upload — XHR exposes byte-level progress that
        // fetch() does not.
        const fd = new FormData();
        for (const f of converted) fd.append('images', f);
        showProgress(`Uploading ${total} image${total === 1 ? '' : 's'}…`, false, 0);
        await postWithProgress(`/api/filaments/${filamentId}/images`, fd, (loaded, totalBytes) => {
          const pct = (loaded / totalBytes) * 100;
          showProgress(`Uploading ${total} image${total === 1 ? '' : 's'}…`, false, pct);
        });
        showProgress('Done', false, 100);
        await init();
      } catch (e) {
        hideProgress();
        alert('Upload failed: ' + (e.message || e));
        btn.disabled = false;
        btn.textContent = '＋ Add images';
      }
    }

    // Back button: prefer real history.back so it matches the browser back
    // button. If we landed here via a direct URL (no history), fall back to /.
    $('#back-btn').addEventListener('click', () => {
      if (history.length > 1) history.back();
      else location.href = '/';
    });

    // ---- Lightbox slider ----
    const lb = $('#lightbox');
    const lbTrack = $('#lightbox-track');
    const lbCounter = $('#lightbox-counter');
    const lbPrev = $('#lightbox-prev');
    const lbNext = $('#lightbox-next');
    const lbStage = $('#lightbox-stage');
    let lbUrls = [];
    let lbIndex = 0;

    function openLightbox(urls, startIndex) {
      lbUrls = urls.slice();
      lbIndex = Math.max(0, Math.min(startIndex, lbUrls.length - 1));
      lbTrack.innerHTML = lbUrls.map(u => `
        <div class="lightbox-slide"><img src="${u.replace(/"/g,'&quot;')}" alt=""></div>
      `).join('');
      lb.classList.add('open');
      lb.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      updateLightbox(false);
    }

    function closeLightbox() {
      lb.classList.remove('open');
      lb.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      lbTrack.innerHTML = '';
      lbUrls = [];
    }

    function updateLightbox(animate = true) {
      lbTrack.classList.toggle('dragging', !animate);
      lbTrack.style.transform = `translateX(${-lbIndex * 100}%)`;
      lbCounter.textContent = lbUrls.length ? `${lbIndex + 1} / ${lbUrls.length}` : '';
      lbPrev.classList.toggle('disabled', lbIndex <= 0);
      lbNext.classList.toggle('disabled', lbIndex >= lbUrls.length - 1);
    }

    function lbStep(dir) {
      const next = lbIndex + dir;
      if (next < 0 || next >= lbUrls.length) return;
      lbIndex = next;
      updateLightbox(true);
    }

    $('#lightbox-close').addEventListener('click', closeLightbox);
    lbPrev.addEventListener('click', () => lbStep(-1));
    lbNext.addEventListener('click', () => lbStep(+1));

    // Keyboard nav
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape')      closeLightbox();
      if (e.key === 'ArrowLeft')   lbStep(-1);
      if (e.key === 'ArrowRight')  lbStep(+1);
    });

    // Touch swipe
    let touchStartX = 0, touchStartY = 0, touchDx = 0, swiping = false;
    lbStage.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchDx = 0;
      swiping = true;
    }, { passive: true });
    lbStage.addEventListener('touchmove', e => {
      if (!swiping) return;
      const dx = e.touches[0].clientX - touchStartX;
      const dy = e.touches[0].clientY - touchStartY;
      // If the gesture is mostly vertical, bail out — let the user scroll.
      if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 12) { swiping = false; return; }
      touchDx = dx;
      // Drag the track with the finger
      const pct = (dx / lbStage.clientWidth) * 100;
      lbTrack.classList.add('dragging');
      lbTrack.style.transform = `translateX(calc(${-lbIndex * 100}% + ${pct}%))`;
    }, { passive: true });
    lbStage.addEventListener('touchend', () => {
      if (!swiping) return;
      swiping = false;
      const threshold = lbStage.clientWidth * 0.18;
      if (touchDx <= -threshold && lbIndex < lbUrls.length - 1) lbIndex++;
      else if (touchDx >= threshold && lbIndex > 0) lbIndex--;
      updateLightbox(true);
    });

    // Click on the dimmed area outside the image closes; clicks on the image / arrows / counter don't.
    lb.addEventListener('click', e => {
      if (e.target === lb || e.target === lbStage || e.target.classList.contains('lightbox-track')) closeLightbox();
    });

    async function init() {
      try {
        await detectAuth();
        const f = await loadFilament();
        render(f);
      } catch (e) {
        $('#main').innerHTML = `<div class="card" style="text-align:center;color:var(--danger)">${escHtml(e.message || 'Failed to load')}</div>`;
      }
    }
    init();
  </script>
</body>
</html>
