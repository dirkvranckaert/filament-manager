<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Filament Swatches</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg:         #f1f5f9;
      --surface:    #ffffff;
      --border:     #e2e8f0;
      --text:       #1a202c;
      --text-muted: #718096;
      --primary:    #0f766e;
      --radius:     6px;
      --shadow:     0 1px 3px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.06);
      --rows:      3;
      --swatch-w:  240px;
      --swatch-h:  142px;
      --gap:       12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:         #0f172a;
        --surface:    #1e293b;
        --border:     #334155;
        --text:       #f1f5f9;
        --text-muted: #94a3b8;
        --primary:    #14b8a6;
        --shadow:     0 1px 3px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.25);
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px; color: var(--text); background: var(--bg); min-height: 100vh;
    }
    .hidden { display: none !important; }

    /* ── Topbar ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; height: 52px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow); position: sticky; top: 0; z-index: 10;
    }
    .app-title { font-size: 18px; font-weight: 700; color: var(--primary); }
    .topbar-right { display: flex; gap: 8px; align-items: center; }
    .count-chip {
      font-size: 12px; color: var(--text-muted); background: var(--bg);
      border: 1px solid var(--border); padding: 3px 10px; border-radius: 999px; font-weight: 500;
    }
    .readonly-badge {
      font-size: 11px; font-weight: 600; color: var(--text-muted);
      background: var(--bg); border: 1px solid var(--border);
      padding: 3px 10px; border-radius: 999px; letter-spacing: .3px;
    }

    /* ── Page layout ── */
    .page-content {
      max-width: 1200px; margin: 0 auto; padding: 20px 16px;
      display: flex; flex-direction: column; gap: 16px;
    }

    /* ── Cards ── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
    .card-header {
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      font-size: 11px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .5px;
    }
    .card-body { padding: 16px; }

    /* ── Filters ── */
    .filters-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .form-field { display: flex; flex-direction: column; gap: 5px; }
    .form-field label { font-size: 13px; font-weight: 500; }
    .form-field input,
    .form-field select {
      width: 100%; padding: 7px 10px; border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 13px; color: var(--text);
      background: var(--surface); font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    .form-field input:focus, .form-field select:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15,118,110,.15);
    }

    /* ── Carousel ── */
    .carousel-wrap { position: relative; overflow: hidden; }
    .carousel {
      display: flex; gap: 12px; overflow-x: auto; overflow-y: hidden; padding: 16px;
      scroll-snap-type: x mandatory; touch-action: pan-x; -webkit-overflow-scrolling: touch;
    }
    .carousel::-webkit-scrollbar { height: 8px; }
    .carousel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
    .carousel::-webkit-scrollbar-track { background: transparent; }
    .page {
      flex: 0 0 auto;
      display: grid;
      grid-template-rows: repeat(var(--rows), var(--swatch-h));
      grid-auto-flow: column;
      grid-auto-columns: var(--swatch-w);
      gap: var(--gap);
      scroll-snap-align: start;
    }

    /* ── Swatches ── */
    .swatch {
      width: var(--swatch-w); height: var(--swatch-h); border-radius: 14px; position: relative;
      border: 1px solid rgba(0,0,0,.08); box-shadow: 0 2px 8px rgba(0,0,0,.14);
      display: flex; align-items: flex-end; overflow: hidden; cursor: pointer;
      user-select: none;
    }
    .swatch .label { width: 100%; padding: 10px 12px; font-weight: 700; letter-spacing: .2px; }
    .swatch .name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .swatch .meta { font-size: 11px; font-weight: 500; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 700; border: 1px solid rgba(0,0,0,.1);
    }
    .badge.stock {
      position: absolute; top: 34px; left: 8px; padding: 3px 8px; border-radius: 6px;
      background: rgba(255,255,255,.88); color: #1a202c; border: 1px solid rgba(0,0,0,.12);
      backdrop-filter: blur(2px);
    }
    .badge.out {
      background: rgba(0,0,0,.35) !important; color: #fff !important;
      border-color: rgba(255,255,255,.25) !important;
    }
    .hexpill {
      position: absolute; top: 8px; left: 8px;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 11px; padding: 3px 7px; border-radius: 6px;
      background: rgba(0,0,0,.28); color: inherit; border: 1px solid rgba(0,0,0,.12);
      backdrop-filter: blur(2px);
    }
    .navbtn {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      border-radius: 999px; width: 36px; height: 36px;
      display: grid; place-items: center; cursor: pointer;
      box-shadow: var(--shadow); font-size: 15px;
    }
    .navbtn:hover { background: var(--bg); }
    .navbtn.left  { left: 6px; }
    .navbtn.right { right: 6px; }
    .empty-state { text-align: center; padding: 32px 16px; color: var(--text-muted); font-size: 14px; }

    /* ── Disabled / error state ── */
    .info-card {
      text-align: center; padding: 48px 24px; color: var(--text-muted);
    }
    .info-card .icon { font-size: 32px; margin-bottom: 12px; }
    .info-card p { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .info-card small { font-size: 13px; }

    @media (max-width: 720px) {
      .filters-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <span class="app-title">Filament Swatches</span>
    </div>
    <div class="topbar-right">
      <span class="count-chip hidden" id="countChip">0 items</span>
      <span class="readonly-badge">View only</span>
    </div>
  </header>

  <!-- Disabled / error message -->
  <div class="page-content hidden" id="disabledMsg">
    <div class="card">
      <div class="card-body info-card">
        <div class="icon">🔒</div>
        <p>Public swatch view is not enabled</p>
        <small>Please contact the administrator for access.</small>
      </div>
    </div>
  </div>

  <!-- Main content -->
  <main class="page-content hidden" id="mainContent">

    <!-- Filters -->
    <div class="card">
      <div class="card-header">Filter</div>
      <div class="card-body">
        <div class="filters-grid">
          <div class="form-field">
            <label for="q">Search</label>
            <input id="q" type="text" placeholder="Brand, type, color…" />
          </div>
          <div class="form-field">
            <label for="typeFilter">Type</label>
            <select id="typeFilter">
              <option value="">Any</option>
              <option>PLA</option><option>PETG</option><option>ABS</option>
              <option>ASA</option><option>TPU</option>
            </select>
          </div>
          <div class="form-field">
            <label for="stockFilter">In stock</label>
            <select id="stockFilter">
              <option value="">Any</option>
              <option value="true">Yes</option>
              <option value="false">No</option>
            </select>
          </div>
          <div class="form-field">
            <label for="variantFilter">Variant</label>
            <select id="variantFilter">
              <option value="">Any</option>
              <option>Basic</option><option>Mat</option><option>Metal</option>
              <option>Glow</option><option>Marble</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Swatches -->
    <div class="card">
      <div class="card-header">Swatches</div>
      <div class="card-body" style="padding:0">
        <div class="carousel-wrap">
          <button class="navbtn left"  id="prevBtn" title="Previous">‹</button>
          <button class="navbtn right" id="nextBtn"  title="Next">›</button>
          <div class="carousel" id="carousel"></div>
        </div>
        <div id="emptyMsg" class="empty-state hidden">No filaments match your filters.</div>
      </div>
    </div>

  </main>

  <template id="swatchTpl">
    <div class="swatch" title="Click to copy hex color">
      <div class="badge stock"></div>
      <div class="hexpill"></div>
      <div class="label">
        <div class="name"></div>
        <div class="meta"></div>
      </div>
    </div>
  </template>

  <script>
    const $ = sel => document.querySelector(sel);
    const $$ = sel => Array.from(document.querySelectorAll(sel));

    // ===== Utils =====
    function hexFromRgb({r,g,b}){ const h=v=>v.toString(16).padStart(2,'0'); return '#'+h(r)+h(g)+h(b); }
    function bestTextColor(rgb){
      const lin=[rgb.r,rgb.g,rgb.b].map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);});
      const L=0.2126*lin[0]+0.7152*lin[1]+0.0722*lin[2];
      return (L+0.05)/0.05>=1.05/(L+0.05)?'#000':'#fff';
    }

    // ===== Sort by hue =====
    function sortLightToDark(list){
      function toHsl({r,g,b}){
        r/=255;g/=255;b/=255;
        const max=Math.max(r,g,b),min=Math.min(r,g,b);
        let h=0,s=0;const l=(max+min)/2,d=max-min;
        if(d!==0){
          s=d/(1-Math.abs(2*l-1));
          switch(max){case r:h=((g-b)/d)%6;break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}
          h*=60;if(h<0)h+=360;
        }
        return{h,s,l};
      }
      function sector(h){
        if(h>=40&&h<80)return 0;if(h>=80&&h<160)return 1;if(h>=160&&h<200)return 2;
        if(h>=200&&h<260)return 3;if(h>=260&&h<300)return 4;if(h>=300&&h<340)return 5;
        if(h>=340)return 6;return 7;
      }
      function key(it){
        const{h,s,l}=toHsl(it.colorRGB);
        if(s<=0.12)return l<=0.14?[2,l]:[0,-l];
        return[1,sector(h),-l];
      }
      return [...list].sort((a,b)=>{
        const ka=key(a),kb=key(b);
        for(let i=0;i<ka.length;i++){if(ka[i]<kb[i])return -1;if(ka[i]>kb[i])return 1;}
        return 0;
      });
    }

    // ===== Filters =====
    function applyFilters(list){
      const query=($('#q')?.value||'').trim().toLowerCase();
      const t=($('#typeFilter')?.value||'').trim().toLowerCase();
      const s=$('#stockFilter')?.value??'';
      const v=($('#variantFilter')?.value||'').trim().toLowerCase();
      return list.filter(it=>{
        if(query){const hay=`${it.brand} ${it.type} ${it.colorName} ${it.variant||''}`.toLowerCase();if(!hay.includes(query))return false;}
        if(t&&it.type.toLowerCase()!==t)return false;
        if(v&&(it.variant||'').toLowerCase()!==v)return false;
        if(s!==''&&String(!!it.inStock)!==s)return false;
        return true;
      });
    }

    // ===== Carousel =====
    let items = [];
    const carousel = $('#carousel');
    const emptyMsg  = $('#emptyMsg');
    const tpl       = $('#swatchTpl');
    const prevBtn   = $('#prevBtn');
    const nextBtn   = $('#nextBtn');

    function computeColumns(){
      const sw=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--swatch-w'))||240;
      return Math.max(1,Math.floor((carousel.clientWidth-32+12)/(sw+12)));
    }
    function paginate(list,rows,cols){
      const pp=rows*cols,pages=[];
      for(let i=0;i<list.length;i+=pp)pages.push(list.slice(i,i+pp));
      return pages;
    }

    function render(){
      const ordered=sortLightToDark(applyFilters(items));
      carousel.innerHTML='';
      emptyMsg.classList.toggle('hidden', ordered.length>0);
      if(!ordered.length){
        prevBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
        return;
      }

      const rows=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--rows'))||3;
      const pages=paginate(ordered,rows,computeColumns());
      prevBtn.classList.toggle('hidden', pages.length<=1);
      nextBtn.classList.toggle('hidden', pages.length<=1);

      for(let p=0;p<pages.length;p++){
        const pageEl=document.createElement('div');
        pageEl.className='page';
        pageEl.style.gridTemplateRows=`repeat(${rows},var(--swatch-h))`;
        pageEl.style.gridAutoColumns='var(--swatch-w)';
        pageEl.dataset.page=String(p);

        for(const it of pages[p]){
          const node=tpl.content.firstElementChild.cloneNode(true);
          node.style.backgroundColor=it.colorHex;
          if(it.patternImage){
            node.style.backgroundImage=`url(/uploads/${encodeURIComponent(it.patternImage)})`;
            node.style.backgroundSize='cover';
            node.style.backgroundPosition='center';
          } else {
            node.style.backgroundImage='';
          }
          node.style.color=bestTextColor(it.colorRGB);
          node.querySelector('.name').textContent=it.brand;
          node.querySelector('.meta').textContent=`${it.type} (${it.variant||'Basic'}) — ${it.colorName}`;
          const badge=node.querySelector('.badge.stock');
          badge.className='badge stock '+(it.inStock?'in':'out');
          badge.textContent=it.inStock?'In stock':'Out';
          const hexEl=node.querySelector('.hexpill');
          if(hexEl)hexEl.textContent=(it.colorHex||'#000000').toUpperCase();

          node.addEventListener('click',()=>{
            const val=(it.colorHex||'').startsWith('#')?it.colorHex:'#'+String(it.colorHex||'').replace(/^#/,'');
            navigator.clipboard?.writeText(val).then(()=>{
              if(hexEl){const old=hexEl.textContent;hexEl.textContent='Copied!';setTimeout(()=>hexEl.textContent=old,900);}
            }).catch(()=>{});
          });

          pageEl.appendChild(node);
        }
        carousel.appendChild(pageEl);
      }
    }

    // Nav buttons
    $('#prevBtn').addEventListener('click',()=>{
      const pages=$$('.page'),left=carousel.scrollLeft;
      let target=0;
      for(const p of pages){if(p.offsetLeft<left-4)target=p.offsetLeft;else break;}
      carousel.scrollTo({left:target,behavior:'smooth'});
    });
    $('#nextBtn').addEventListener('click',()=>{
      const pages=$$('.page'),left=carousel.scrollLeft+4;
      let target=left;
      for(const p of pages){if(p.offsetLeft>left){target=p.offsetLeft;break;}}
      carousel.scrollTo({left:target,behavior:'smooth'});
    });
    window.addEventListener('resize',render);
    ;[$('#q'),$('#typeFilter'),$('#stockFilter'),$('#variantFilter')].forEach(el=>el?.addEventListener('input',render));

    // ===== Init =====
    (async()=>{
      try {
        const res = await fetch('/api/public/filaments');
        if(res.status===403){
          $('#disabledMsg').classList.remove('hidden');
          return;
        }
        if(!res.ok) throw new Error('Server error');
        items = await res.json();
        $('#countChip').textContent=`${items.length} item${items.length===1?'':'s'}`;
        $('#countChip').classList.remove('hidden');
        $('#mainContent').classList.remove('hidden');
        try {
          const s = await fetch('/api/public/settings');
          if (s.ok) {
            const { rows } = await s.json();
            document.documentElement.style.setProperty('--rows', rows);
          }
        } catch {}
        render();
      } catch(e) {
        $('#disabledMsg').classList.remove('hidden');
      }
    })();
  </script>
</body>
</html>
